# Manual (Actions → Run workflow): rehace las capturas de las webs en vivo y hace commit.
# Sin programación: cada push a main despliega en Netlify y gasta créditos.
name: Recapturar webs en vivo
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recapturar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/capture.mjs --live
        continue-on-error: true
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: node scripts/build.mjs
      - name: Commit si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site
          git diff --cached --quiet || (git commit -m "Recaptura de las webs en vivo" && git push)
